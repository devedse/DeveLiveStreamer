# Build, test, package and release using the same PowerShell flow as DeveMobileLPR.
name: GitHubActionsBuilds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_version_number:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
      - name: Generate build number
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: generate_version_number
    if: always() && (needs.generate_version_number.result == 'success' || needs.generate_version_number.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      release_signed: ${{ steps.signing.outputs.configured }}
    env:
      BUILD_NUMBER: ${{ needs.generate_version_number.outputs.build_number || github.run_number }}
      BUILD_VERSION: 1.0.${{ needs.generate_version_number.outputs.build_number || github.run_number }}
      CI: true
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21.0.8
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install FFmpeg for SRT/RTMP interoperability tests
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Restore Android workload and SDK
        run: |
          dotnet workload install maui-android --skip-manifest-update
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Restore, build and test with coverage
        run: ./build.ps1 -Configuration Release -SkipPublish -Version $env:BUILD_VERSION -ApplicationVersion $env:BUILD_NUMBER -ApplicationDisplayVersion $env:BUILD_VERSION
      - name: Detect signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64) `
            -and -not [string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD) `
            -and -not [string]::IsNullOrWhiteSpace($env:KEY_ALIAS) `
            -and -not [string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)
          "configured=$($configured.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($configured) {
            $keystore = Join-Path $env:RUNNER_TEMP 'release.keystore'
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            chmod 600 $keystore
          }
      - name: Package development-signed Android APK
        if: steps.signing.outputs.configured != 'true'
        run: ./eng/Publish-Android.ps1 -Configuration Release -Version $env:BUILD_VERSION -ApplicationVersion $env:BUILD_NUMBER -ApplicationDisplayVersion $env:BUILD_VERSION
      - name: Package release-signed Android APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./eng/Publish-Android.ps1 -Configuration Release -Version $env:BUILD_VERSION -ApplicationVersion $env:BUILD_NUMBER -ApplicationDisplayVersion $env:BUILD_VERSION -Keystore (Join-Path $env:RUNNER_TEMP 'release.keystore') -KeystorePassword $env:KEYSTORE_PASSWORD -KeyAlias $env:KEY_ALIAS -KeyPassword $env:KEY_PASSWORD
      - name: Remove temporary release keystore
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'release.keystore') -Force -ErrorAction SilentlyContinue
      - name: Upload Android APK on every build
        uses: actions/upload-artifact@v7
        with:
          name: DeveLiveStreamer-Android-${{ env.BUILD_VERSION }}
          path: artifacts/android/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ env.BUILD_VERSION }}
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [generate_version_number, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.release_signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: DeveLiveStreamer-Android-1.0.${{ needs.generate_version_number.outputs.build_number }}
          path: artifacts/android
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
          name: 1.0.${{ needs.generate_version_number.outputs.build_number }}
          body: ${{ github.event.head_commit.message }}
          files: artifacts/android/*.apk
          fail_on_unmatched_files: true
          make_latest: true
